name: CI

# Todo corre offline salvo `pnpm audit` (no bloqueante). Nada se conecta a
# app.gavriel.com.ar ni necesita credenciales.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run selfcheck
      # Incluye contract.test: falla si test/tools.snapshot.json derivó (regenerar: pnpm test:snapshot).
      - name: Test
        run: node --test "test/*.test.mjs"
      - name: Audit (prod deps, no bloqueante)
        continue-on-error: true
        run: pnpm audit --prod
      # Listo para bloquear: quitar continue-on-error cuando el lint esté en verde.
      - name: Biome lint (no bloqueante)
        continue-on-error: true
        run: npx --yes @biomejs/biome@2.2.0 lint src test scripts
