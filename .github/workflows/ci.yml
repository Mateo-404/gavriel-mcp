name: CI

# Build + typecheck + selfcheck en cada push/PR. Todo corre offline: nada acá
# se conecta a app.gavriel.com.ar ni necesita credenciales de Gavriel.
# `pnpm run regression` (contra el backend real) queda deliberadamente fuera
# de este workflow — no tiene sentido correrlo en CI.
# Package manager: pnpm (ver `packageManager` en package.json).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Instala pnpm según `packageManager` (no depende de corepack).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Selfcheck (mocks, sin red)
        run: pnpm run selfcheck