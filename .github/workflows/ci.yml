name: CI

# Build + typecheck + selfcheck en cada push/PR. Todo corre offline: nada acá
# se conecta a app.gavriel.com.ar ni necesita credenciales de Gavriel.
# `npm run regression` (contra el backend real) queda deliberadamente fuera
# de este workflow — no tiene sentido correrlo en CI.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Selfcheck (mocks, sin red)
        run: npm run selfcheck
