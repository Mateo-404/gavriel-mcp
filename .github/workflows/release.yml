name: Release

# Build native single-executable binaries (Node.js SEA) for each platform and
# attach them to the GitHub Release created from the pushed tag. Two binaries
# per platform: gavriel-mcp-<plat>-<arch> (MCP server) and gavriel-<plat>-<arch> (CLI).
#
# No third-party RUNTIME deps: SEA embeds Node natively. esbuild + postject
# are build-time only (postject is a Node.js-org tool, not shipped in the
# binary). This avoids deprecated/unmaintained packagers (e.g. pkg, CVE-2024-24828).

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  verify:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check tag, package.json, manifest.json and CHANGELOG
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          pv=$(node -p "require('./package.json').version")
          mv=$(node -p "require('./manifest.json').version")
          [ "$v" = "$pv" ] || { echo "tag $v != package.json $pv"; exit 1; }
          [ "$v" = "$mv" ] || { echo "tag $v != manifest.json $mv"; exit 1; }
          grep -qF "## [$v]" CHANGELOG.md || { echo "CHANGELOG.md sin entrada para $v"; exit 1; }

  build:
    needs: verify
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # attest-build-provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-latest
            platform: darwin
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Build single-executable binaries (Node SEA)
        run: pnpm build:bin
      - name: Checksum
        shell: bash
        run: |
          cd bin
          # gavriel-* cubre gavriel-mcp-<plat>-<arch> y gavriel-<plat>-<arch>
          for f in gavriel-*; do
            case "$f" in *.sha256) continue ;; esac
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: bin/gavriel-*
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gavriel-${{ matrix.platform }}-${{ matrix.arch }}
          path: bin/gavriel-*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
