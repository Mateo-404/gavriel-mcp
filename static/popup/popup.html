<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Gavriel Tools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../logo.svg" alt="Gavriel" class="logo">
    <span class="tag">Tools</span>
  </header>

  <main>
    <label class="card" id="card-mute">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/>
          <g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g>
          <g class="cross"><path d="m16 9 6 6"/><path d="m22 9-6 6"/></g>
        </svg>
      </span>
      <span class="text">
        <strong>Silenciar sonidos</strong>
        <small id="state-mute">Cargando…</small>
      </span>
      <input type="checkbox" id="mute" role="switch">
      <span class="switch" aria-hidden="true"></span>
    </label>

    <section class="sounds" id="sounds" aria-labelledby="sounds-title">
      <h2 id="sounds-title">Qué sonidos silenciar</h2>
      <ul id="sound-list"></ul>
      <p class="note">Si Gavriel reproduce un sonido nuevo, aparece acá para que lo elijas.</p>
    </section>
  </main>

  <footer>
    <button type="button" class="settings" id="open-settings">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
      Ajustes
    </button>
    <span id="version"></span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
